[package]
name = "vtcode-bitcalc"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Arbitrary-width programmer's calculator for hardware and software engineers"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtcode-extension-api = { path = "vendor/vtcode-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
